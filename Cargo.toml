[package]
name = "devsweep"
version = "0.3.0"
edition = "2024"
description = "Blazing-fast dev clutter cleaner — find and nuke node_modules, target/, __pycache__, etc."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
